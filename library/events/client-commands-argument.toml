[from]
loader = "fabric"
class = "net.fabricmc.fabric.api.client.command.v2.ClientCommands"
member = "argument"
aliases = ["net.fabricmc.fabric.api.client.command.v2.ClientCommandManager#argument"]

[to]
hook = "register_client_commands"

[info]
status = "partial"
notes = "Arguments go in the usage string: <name:integer>, <name:word>, <name:text> (the rest of the line, last), <name:boolean>, <name:number>, <name:player>... The command hook gets the typed line (event.command, without the slash): split it and parse the values."
since_api = "0.2"
