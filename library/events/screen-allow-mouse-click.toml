[from]
loader = "fabric"
class = "net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents"
member = "allowMouseClick"

[to]
hook = "screen_mouse_button_pressed_pre"

[info]
status = "direct"
notes = "Return Flow::Cancel to stop the click (returning false in Fabric). One global hook for every screen: check event.screen yourself."
since_api = "0.2"
seen_in = ["https://github.com/selfmonoraque5/macro-keys", "https://github.com/selfmonoraque5/earshot"]
